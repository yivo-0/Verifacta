name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The fetch scripts call the GitHub release API through the gh CLI.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build --configuration Release

      # Uses the embedded manifest and plain HTTPS: no Python, no gh CLI. This is the same
      # command a consumer runs, so CI exercises the real restore path.
      - name: Restore the rule packs
        run: dotnet run --project src/Klarfakt.Cli --configuration Release --no-build -- rules restore

      - name: Fetch the official test corpora
        run: python tools/fetch-corpus.py

      # Runs on net8.0 and net10.0, because the library ships both. KLARFAKT_REQUIRE_CORPUS makes
      # a missing corpus or an unrestored rule pack a failure: without it most of the suite turns
      # into no-ops and a green run proves nothing.
      - name: Test
        env:
          KLARFAKT_REQUIRE_CORPUS: 1
        run: dotnet test --configuration Release --no-build

      # The unit tests are not enough on their own: a rule pack added for rendering broke
      # "validate <folder>" with an unhandled compiler error while every test stayed green.
      # Nothing but running the CLI end to end catches that class of regression.
      # Packing is not the same as being usable. This builds and runs samples/Quickstart against
      # the packed .nupkg from a clean directory with its own package cache, so a file left out of
      # the package fails here rather than in someone else's first five minutes.
      - name: Verify the package from a clean directory
        run: python tools/verify-package.py

      - name: Smoke test the command line
        run: |
          cli() { dotnet run --project src/Klarfakt.Cli --configuration Release --no-build -- "$@"; }

          # More than ten files, so the rule packs are compiled up front rather than lazily.
          status=0
          cli validate corpus/kosit-xrechnung --recursive --csv smoke.csv || status=$?
          # 1 means invoices had findings, which is a normal outcome; 2 or above is a failure.
          [ "$status" -le 1 ] || { echo "validate exited $status"; exit 1; }
          [ "$(wc -l < smoke.csv)" -gt 1 ] || { echo "no CSV rows written"; exit 1; }

          # Not corpus/facturx: it holds ZUGFeRD 1.x files that are rejected by design.
          cli render corpus/peppol-bis --recursive --out smoke-html --lang en
          [ -n "$(ls -A smoke-html)" ] || { echo "no HTML written"; exit 1; }

          cli info corpus/peppol-bis --recursive --json > /dev/null
          cli rules verify

      - name: Publish corpus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-reports
          # One set per target framework: the two runs used to collide writing a single path.
          path: corpus/*.md
          if-no-files-found: warn

  # Klarfakt runs the publishers' own artefacts, so it should agree with the tool the publishers
  # ship. This is the job that proves it instead of asserting it. Java is needed to run the
  # reference; it is not needed to use Klarfakt, which is the whole point.
  reference:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache the reference validator and its configuration
        uses: actions/cache@v4
        with:
          path: .tmp/reference
          key: reference-${{ hashFiles('src/Klarfakt/RulePacks.json', 'tools/reference-diff.py') }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Restore the rule packs
        run: dotnet run --project src/Klarfakt.Cli --configuration Release --no-build -- rules restore

      - name: Fetch the official test corpora
        run: python tools/fetch-corpus.py

      - name: Compare against the reference validator
        run: python tools/reference-diff.py

      - name: Publish the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-diff
          path: corpus/reference-diff.md
          if-no-files-found: warn
